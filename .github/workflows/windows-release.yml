name: Build Windows release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create when running manually
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build standalone Windows application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TableAndThymeBilling --collect-all webview --collect-all flask --collect-all waitress --add-data "restaurant_billing/ui;restaurant_billing/ui" restaurant_billing/app.py
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.2.0' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/TableAndThymeBilling.exe
